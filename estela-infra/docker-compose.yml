services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estela
      POSTGRES_USER: estela
      POSTGRES_PASSWORD: estela
    ports:
      - "5432:5432"
    volumes:
      - estela-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estela -d estela"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../estela-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ../estela-web:/usr/share/nginx/html:ro
    depends_on:
      - api

  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  estela-db:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
